name: Build

# Every push and pull request compiles the plugin on Windows.
# Pushing a version tag (for example v0.1.0.0) also publishes a GitHub release with the
# plugin zip and a ready-to-submit NINA manifest.json.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/PlanAstro.NINA/PlanAstro.NINA.csproj -c Release

      - name: Package plugin
        shell: pwsh
        run: |
          $out = "src/PlanAstro.NINA/bin/Release/net8.0-windows"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $files = @("$out/PlanAstro.NINA.dll", "$out/PlanAstro.NINA.pdb", "$out/System.Security.Cryptography.ProtectedData.dll") | Where-Object { Test-Path $_ }
          Compress-Archive -Path $files -DestinationPath artifacts/PlanAstro.NINA.zip -Force

      - name: Create manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          ./tools/New-Manifest.ps1 `
            -Dll "src/PlanAstro.NINA/bin/Release/net8.0-windows/PlanAstro.NINA.dll" `
            -Archive "artifacts/PlanAstro.NINA.zip" `
            -DownloadUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PlanAstro.NINA.zip" `
            -OutFile "artifacts/manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: PlanAstro.NINA
          path: artifacts/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PlanAstro.NINA.zip
            artifacts/manifest.json
          generate_release_notes: true
